<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 25</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Para datos personales</legend>
            <label>Teléfono</label>
            <input type="text" placeholder="9 números" pattern="[6789][0-9]{8}">
            <label>Correo electrónico</label>
            <input type="email" placeholder="El formato correcto es nombre+@+servidor de correo">
        </fieldset>

        <fieldset>
            <legend>Para valores numéricos</legend>
            <label>Número de personas</label>
            <input type="number">
            <label>Mueva la barra para indicar puntuación (Del 1 al 10)</label>
        </fieldset>
    </form>
</body>
</html>
