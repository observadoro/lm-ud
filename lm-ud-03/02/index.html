<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <style>
        body {font-family: verdana;}
        div {background-color: pink; border: 2px solid #000; width: 500px; margin: 0 auto;}
        p {color: blue; text-align: center;}
        p:nth-child(even) {background-color: silver;}
        p:nth-child(3) {font-size: 20px; text-align: right;}
        span {color: red;}

    </style>
</head>
<body>
    <div>
        <p>Texto <span>centrado</span>.</p>
        <p>Texto centrado sobre fondo de color plata.</p>
        <p>Texto <span>alineado</span> a la derecha.</p>
        <p>Otro texto centrado sobre fondo de color plata.</p>
    </div>
</body>
</html>
